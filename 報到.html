<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>師傅報到系統</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <style>
    body { margin:0; font-family: Arial,"Microsoft JhengHei",sans-serif; background:#f3f4f6; padding:20px; }
    .app { max-width: 900px; margin: 0 auto; background:#fff; border-radius:16px; box-shadow:0 10px 24px rgba(0,0,0,.08); padding:20px; }
    h1 { text-align:center; color:#1e40af; }
    .login-box { text-align:center; padding:40px 20px; }
    .login-btn { background:#db4437; color:white; padding:15px 30px; font-size:18px; border:none; border-radius:8px; cursor:pointer; }
    select, button { padding:10px; font-size:16px; margin:10px; border-radius:8px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>師傅報到系統</h1>

    <!-- 登入畫面 -->
    <div id="loginSection" class="login-box">
      <h2>請先使用 Google 登入</h2>
      <button class="login-btn" onclick="loginWithGoogle()">🔑 Google 登入</button>
    </div>

    <!-- 選擇師傅畫面 -->
    <div id="selectMasterSection" style="display:none; text-align:center; padding:30px;">
      <h2>歡迎！請選擇您的姓名</h2>
      <select id="masterSelect" style="width:80%; max-width:400px; padding:12px; font-size:18px;">
        <option value="">-- 請選擇師傅姓名 --</option>
      </select><br><br>
      <button onclick="saveMaster()" style="background:#2563eb; color:white; padding:12px 30px;">確認並進入系統</button>
    </div>

    <!-- 主系統畫面 -->
    <div id="mainApp" style="display:none;">
      <div style="text-align:right;">
        <strong id="currentMaster"></strong> | 
        <button onclick="logout()" style="color:red;">登出</button>
      </div>
      
      <h2 style="text-align:center;">報到功能</h2>
      <!-- 你原本的報到、分頁、雜支內容可貼在這裡 -->
      <p>目前已登入，可開始使用報到系統。</p>
    </div>
  </div>

<script>
// Firebase 配置
const firebaseConfig = {
  apiKey: "AIzaSyA1_1XFRJ2QyWwQ911aoLlzOLJ_DEcVlbY",
  authDomain: "dad-host-arrive.firebaseapp.com",
  projectId: "dad-host-arrive",
  storageBucket: "dad-host-arrive.firebasestorage.app",
  messagingSenderId: "78103512421",
  appId: "1:78103512421:web:8f834c32f14031b26bcd8c"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.languageCode = 'zh-TW';

const masters = [
  "楊家齊","陳俊孝","葉芷柔","林慧筑","趙建鈞","楊宗珉","江明聰","林威州",
  "郭永昌","黃怡庭","夏郡甫","廖榮貴","孫志榮","胡天養","李僑紋","楊福昌",
  "邱鉦元","陳炳煌","張佑承","黃詩權","孫寶堂","陳志偉","陳柏翔","陳侄農",
  "王瑜翔","陳韋晴","張奕揚","陳永杰"
];

// Google 登入
function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => alert('登入失敗：' + err.message));
}

// 選擇師傅
function saveMaster() {
  const selected = document.getElementById('masterSelect').value;
  if (!selected) return alert('請選擇師傅姓名');
  
  localStorage.setItem('currentMaster', selected);
  showMainApp(selected);
}

// 顯示主畫面
function showMainApp(masterName) {
  document.getElementById('selectMasterSection').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('currentMaster').textContent = masterName;
}

// 登出
function logout() {
  auth.signOut();
  localStorage.removeItem('currentMaster');
  location.reload();
}

// 監聽登入狀態
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginSection').style.display = 'none';
    
    const savedMaster = localStorage.getItem('currentMaster');
    if (savedMaster) {
      showMainApp(savedMaster);
    } else {
      // 第一次登入，顯示選擇師傅
      const select = document.getElementById('masterSelect');
      masters.forEach(name => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        select.appendChild(opt);
      });
      document.getElementById('selectMasterSection').style.display = 'block';
    }
  }
});
</script>
</body>
</html>
