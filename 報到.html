<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>師傅報到系統</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    body{
      margin:0;
      font-family:Arial,"Microsoft JhengHei",sans-serif;
      background:#f3f4f6;
      padding:20px;
    }

    .app{
      max-width:900px;
      margin:auto;
      background:#fff;
      border-radius:16px;
      box-shadow:0 10px 24px rgba(0,0,0,.08);
      padding:20px;
    }

    h1{
      text-align:center;
      color:#1e40af;
    }

    .login-box{
      text-align:center;
      padding:50px 20px;
    }

    .login-btn{
      background:#db4437;
      color:#fff;
      border:none;
      padding:16px 32px;
      font-size:20px;
      border-radius:10px;
      cursor:pointer;
    }

    .tabs{
      display:flex;
      gap:10px;
      margin-bottom:16px;
      flex-wrap:wrap;
    }

    .tabs button{
      border:none;
      padding:10px 12px;
      border-radius:8px;
      background:#e5e7eb;
      cursor:pointer;
      font-weight:700;
    }

    .tabs button.active{
      background:#2563eb;
      color:white;
    }

    .page{
      display:none;
    }

    .page.active{
      display:block;
    }

    .grid{
      display:grid;
      gap:12px;
    }

    @media(min-width:700px){
      .grid.two{
        grid-template-columns:1fr 1fr;
      }
    }

    label{
      font-weight:700;
      margin-bottom:6px;
      display:block;
    }

    input,select{
      width:100%;
      border:1px solid #d1d5db;
      border-radius:8px;
      padding:10px;
      font-size:15px;
      box-sizing:border-box;
    }

    .btns{
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      margin-top:16px;
    }

    .btn{
      border:none;
      color:white;
      border-radius:10px;
      cursor:pointer;
      font-weight:700;
    }

    .btn.in{
      background:#2563eb;
      font-size:30px;
      padding:24px 34px;
      min-width:240px;
    }

    .btn.out{
      background:#0f766e;
      font-size:30px;
      padding:24px 34px;
      min-width:240px;
    }

    .status{
      margin-top:14px;
      background:#f9fafb;
      border:1px solid #e5e7eb;
      border-radius:8px;
      padding:10px;
      white-space:pre-wrap;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
    }

    th,td{
      border:1px solid #e5e7eb;
      padding:8px;
    }

    th{
      background:#f3f4f6;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>師傅報到系統</h1>

  <!-- 登入 -->
  <div id="loginSection" class="login-box">

    <h2>請先登入系統</h2>

    <button class="login-btn" id="googleLoginBtn">
      🔑 使用 Google 帳號登入
    </button>

  </div>

  <!-- 第一次綁定 -->
  <div id="selectSection" style="display:none;text-align:center;padding:40px;">

    <h2>第一次登入</h2>

    <p>請選擇你的姓名</p>

    <select id="masterSelect">
      <option value="">-- 選擇師傅 --</option>
    </select>

    <br><br>

    <button
      id="saveSelectionBtn"
      style="background:#2563eb;color:white;padding:12px 40px;border:none;border-radius:10px;font-size:18px;"
    >
      確認進入系統
    </button>

  </div>

  <!-- 主系統 -->
  <div id="mainApp" style="display:none;">

    <div style="text-align:right;margin-bottom:12px;">
      <strong id="currentMaster"></strong>
      <button id="logoutBtn" style="margin-left:10px;color:red;">
        登出
      </button>
    </div>

    <div class="tabs">
      <button class="active" data-page="checkin">報到</button>
      <button data-page="working">上班中</button>
      <button data-page="expense">雜支</button>
    </div>

    <!-- 報到 -->
    <section id="checkin" class="page active">

      <div class="grid two">

        <div>
          <label>案場名稱</label>
          <select id="siteSelect"></select>
        </div>

        <div>
          <label>備註</label>
          <input id="note" placeholder="可不填"/>
        </div>

      </div>

      <div class="btns">

        <button class="btn in" id="btnIn">
          上班報到
        </button>

        <button class="btn out" id="btnOut">
          下班報到
        </button>

      </div>

      <pre class="status" id="checkinStatus">等待操作...</pre>

    </section>

    <!-- 上班中 -->
    <section id="working" class="page">

      <button
        class="btn"
        style="background:#374151;padding:10px 18px;"
        id="btnRefreshWorking"
      >
        重新整理
      </button>

      <table>

        <thead>
          <tr>
            <th>師傅</th>
            <th>案場</th>
            <th>上班時間</th>
            <th>下班時間</th>
            <th>備註</th>
          </tr>
        </thead>

        <tbody id="workingBody"></tbody>

      </table>

    </section>

    <!-- 雜支 -->
    <section id="expense" class="page">

      <div class="grid two">

        <div>
          <label>日期</label>
          <input type="date" id="expenseDate"/>
        </div>

        <div>
          <label>雜支</label>
          <input type="number" id="misc" value="0"/>
        </div>

      </div>

      <div class="grid two" style="margin-top:10px;">

        <div>
          <label>餐費</label>
          <input type="number" id="meal" value="0"/>
        </div>

        <div>
          <label>涼水</label>
          <input type="number" id="water" value="0"/>
        </div>

      </div>

      <div style="margin-top:10px;">

        <label>備註</label>
        <input id="expenseNote"/>

      </div>

      <div class="btns">

        <button class="btn in" id="btnExpense">
          送出
        </button>

      </div>

      <pre class="status" id="expenseStatus">等待操作...</pre>

    </section>

  </div>
</div>

<script>
function calculateWorkLabel(hours){

  let half = false;
  let full = false;
  let overtime = 0;

  if(hours <= 4){
    half = true;
  }
  else if(hours < 9){
    half = true;
    overtime = Math.floor(hours - 4);
  }
  else{
    full = true;
    overtime = Math.floor(hours - 9);
  }

  return { half, full, overtime };
}
let CURRENT_MASTER = "";

// ================= Firebase =================

const firebaseConfig = {
  apiKey: "AIzaSyA1_1XFRJ2QyWwQ911aoLlzOLJ_DEcVlbY",
  authDomain: "dad-host-arrive.firebaseapp.com",
  projectId: "dad-host-arrive",
  storageBucket: "dad-host-arrive.firebasestorage.app",
  messagingSenderId: "78103512421",
  appId: "1:78103512421:web:8f834c32f14031b26bcd8c"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.languageCode = "zh-TW";

// ================= GAS =================

const GAS_URL =
"https://script.google.com/macros/s/AKfycbyCfZIuCOltSx-3xBfv2qX5SVa6klDZG8kv-fc8nn45B5OOpJwgkUxWkuzmE0rXpRXY/exec";

// ================= GPS =================

const siteLocations = {
  "達麗": { lat:24.1642, lng:120.6465 },
   "達麗標準": { lat:24.1642, lng:120.6465 },
  "拾穗": { lat:24.1657, lng:120.6395 },
  "淡江大學": { lat:25.1731, lng:121.4479 },
  "寶輝": { lat:24.1395, lng:120.6438 }
};

// ================= DATA =================

const masters = [
  "楊家齊",
  "陳俊孝",
  "葉芷柔",
  "林慧筑",
  "趙建鈞",
  "楊宗珉",
  "江明聰",
  "林威州",
  "郭永昌",
  "黃怡庭",
  "夏郡甫",
  "廖榮貴",
  "孫志榮",
  "胡天養",
  "李僑紋",
  "楊福昌",
  "邱鉦元",
  "陳炳煌",
  "張佑承",
  "黃詩權",
  "孫寶堂",
  "陳志偉",
  "陳柏翔",
  "陳侄農",
  "王瑜翔",
  "陳韋晴",
  "張奕揚",
  "陳永杰"
];

const todaySites = [
  "達麗",
  "達麗標準",
  "拾穗",
  "寶輝",
   "淡江大學",
  "點工"
];

// ================= 距離 =================

function getDistance(lat1,lng1,lat2,lng2){

  const R = 6371;

  const dLat = (lat2-lat1) * Math.PI / 180;
  const dLng = (lng2-lng1) * Math.PI / 180;

  const a =
    Math.sin(dLat/2) * Math.sin(dLat/2) +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLng/2) * Math.sin(dLng/2);

  return R * 2 * Math.atan2(Math.sqrt(a),Math.sqrt(1-a)) * 1000;
}

// ================= init =================

function initSelects(){

  const site = document.getElementById("siteSelect");
  const master = document.getElementById("masterSelect");

  site.innerHTML = "";
  master.innerHTML = '<option value="">-- 選擇師傅 --</option>';

  masters.forEach(m => {

    const opt = document.createElement("option");

    opt.value = m;
    opt.textContent = m;

    master.appendChild(opt);

  });

  todaySites.forEach(s => {

    const opt = document.createElement("option");

    opt.value = s;
    opt.textContent = s;

    site.appendChild(opt);

  });
}

// ================= login =================

function loginWithGoogle(){

  const provider = new firebase.auth.GoogleAuthProvider();

  auth.signInWithPopup(provider)
    .catch(err => {
      alert("登入失敗：" + err.message);
    });
}

// ================= save =================

async function saveSelection(){

  const master =
    document.getElementById("masterSelect").value;

  if(!master){
    alert("請選擇師傅");
    return;
  }

  const user = auth.currentUser;

  await db.collection("users")
    .doc(user.uid)
    .set({

      email:user.email,
      master:master,
      createdAt:new Date()

    });

  CURRENT_MASTER = master;

  showMain(master);
}
function showMain(master){

  document.getElementById("selectSection").style.display = "none";
  document.getElementById("mainApp").style.display = "block";
  document.getElementById("currentMaster").textContent = master;

}
// ================= show =================
function calculateWorkLabel(hours){

  let overtime = 0;
  let halfDay = false;

  if(hours <= 4){
    halfDay = true;
    overtime = 0;
  }
  else if(hours <= 9){
    halfDay = true;
    overtime = Math.floor(hours - 4);
  }
  else {
    halfDay = false;
    overtime = Math.floor(hours - 9);
  }

  return {
    halfDay,
    overtime
  };
}
// ================= 上班 =================

document.getElementById("btnIn")
.addEventListener("click", async () => {

  const master = CURRENT_MASTER;

  const site =
    document.getElementById("siteSelect").value;

  const note =
    document.getElementById("note").value;

  if(!site){
    alert("請選案場");
    return;
  }

  navigator.geolocation.getCurrentPosition(

    async pos => {

      const userLat = pos.coords.latitude;
      const userLng = pos.coords.longitude;

      const siteData = siteLocations[site];

      const distance = getDistance(
        userLat,
        userLng,
        siteData.lat,
        siteData.lng
      );
alert(`距離 ${Math.round(distance)}m`);

console.log("user:", userLat, userLng);
console.log("site:", siteData);
      if(distance > 800){

        alert(`❌ 不在案場範圍內 (${Math.round(distance)}m)`);

        return;
      }

      const now = new Date();

      await db.collection("checkins").add({

        master,
        site,
        note,
        type:"in",
        isWorking:true,
        lat:userLat,
        lng:userLng,
        time:now

      });

      document.getElementById("checkinStatus").textContent =
        "✅ 上班成功";

    },

    err => {

      alert("GPS 取得失敗");

    }

  );

});

// ================= 下班 =================

document.getElementById("btnOut")
.addEventListener("click", async () => {

  const master = CURRENT_MASTER;

  const snapshot = await db.collection("checkins")
    .where("master","==",master)
    .where("isWorking","==",true)
    .orderBy("time","desc")
    .limit(1)
    .get();

  if(snapshot.empty){
    alert("找不到上班紀錄");
    return;
  }

  const doc = snapshot.docs[0];
  const data = doc.data();

  const outTime = new Date();

const hours =
  (outTime - data.time.toDate()) / 3600000;

// ⭐⭐⭐ 就貼在這裡
const calc = calculateWorkLabel(hours);

let value = data.site;

if(calc.full){
  value += "+" + calc.overtime;
}
else if(calc.half){
  value += "半";
  if(calc.overtime > 0){
    value += "+" + calc.overtime;
  }
}
  // ✅ 4. 更新 Firebase
  await doc.ref.update({
    outTime,
    hours,
    isWorking:false
  });

  // ✅ 5. 寫入 GAS
  await fetch(GAS_URL, {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({
      master: data.master,
      site: value,
      hours
    })
  });

  document.getElementById("checkinStatus").textContent =
  `✅ 下班成功\n工時：${hours.toFixed(1)} 小時\n狀態：${value}`;
});

// ================= 上班中 =================

async function loadWorking(){

  const tbody =
    document.getElementById("workingBody");

  tbody.innerHTML = "";

  const snapshot = await db.collection("checkins")
    .orderBy("time","desc")
    .get();

  snapshot.forEach(doc => {

    const d = doc.data();

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${d.master || ""}</td>
      <td>${d.site || ""}</td>
      <td>${d.time ? d.time.toDate().toLocaleString() : ""}</td>
      <td>${d.outTime ? d.outTime.toDate().toLocaleString() : "上班中"}</td>
      <td>${d.note || ""}</td>
    `;

    tbody.appendChild(tr);

  });

}

// ================= 雜支 =================

document.getElementById("btnExpense")
.addEventListener("click", async () => {

  await db.collection("expenses").add({

    master:CURRENT_MASTER,
    date:document.getElementById("expenseDate").value,
    misc:Number(document.getElementById("misc").value),
    meal:Number(document.getElementById("meal").value),
    water:Number(document.getElementById("water").value),
    note:document.getElementById("expenseNote").value,
    createdAt:new Date()

  });

  document.getElementById("expenseStatus").textContent =
    "✅ 已送出";

});

// ================= tabs =================

document.querySelectorAll(".tabs button")
.forEach(btn => {

  btn.addEventListener("click", () => {

    document.querySelectorAll(".tabs button")
      .forEach(b => b.classList.remove("active"));

    document.querySelectorAll(".page")
      .forEach(p => p.classList.remove("active"));

    btn.classList.add("active");

    document.getElementById(btn.dataset.page)
      .classList.add("active");

  });

});

// ================= auth =================

auth.onAuthStateChanged(async user => {

  if(!user){

    document.getElementById("loginSection").style.display =
      "block";

    document.getElementById("mainApp").style.display =
      "none";

    document.getElementById("selectSection").style.display =
      "none";

    return;
  }

  document.getElementById("loginSection").style.display =
    "none";

  const doc = await db.collection("users")
    .doc(user.uid)
    .get();

 if(doc.exists){

  const data = doc.data();
  CURRENT_MASTER = data.master;

  showMain(data.master);

  initSelects(); // ⭐⭐⭐ 加這行


  }else{

    document.getElementById("selectSection").style.display =
      "block";

    initSelects();

  }

});

// ================= events =================

document.getElementById("googleLoginBtn")
.addEventListener("click", loginWithGoogle);

document.getElementById("saveSelectionBtn")
.addEventListener("click", saveSelection);

document.getElementById("logoutBtn")
.addEventListener("click", () => auth.signOut());

document.getElementById("btnRefreshWorking")
.addEventListener("click", loadWorking);

</script>
</body>
</html>
