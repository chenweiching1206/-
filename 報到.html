<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>盛勤師傅報到系統</title>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<style>
body { margin:0; font-family: Arial,"Microsoft JhengHei",sans-serif; background:#f3f4f6; padding:20px; }
.app { max-width:900px; margin:auto; background:#fff; padding:20px; border-radius:16px; box-shadow:0 10px 24px rgba(0,0,0,.08); }
h1 { text-align:center; color:#1e40af; }

.login-box { text-align:center; padding:60px 20px; }
.login-btn { background:#db4437; color:#fff; padding:16px 32px; font-size:20px; border:none; border-radius:8px; cursor:pointer; }

.tabs { display:flex; gap:10px; margin:16px 0; flex-wrap:wrap; }
.tabs button { border:none; padding:10px 12px; border-radius:8px; background:#e5e7eb; cursor:pointer; font-weight:700; }
.tabs button.active { background:#2563eb; color:#fff; }

.page { display:none; }
.page.active { display:block; }

.btn { border:none; border-radius:8px; color:#fff; padding:10px 14px; cursor:pointer; }
.btn.in { background:#2563eb; font-size:28px; padding:20px; }
.btn.out { background:#0f766e; font-size:28px; padding:20px; }

.status { margin-top:10px; background:#f9fafb; padding:10px; border-radius:8px; }

select, input { width:100%; padding:10px; margin-top:5px; }
</style>
</head>

<body>
<div class="app">
<h1>盛勤師傅報到系統</h1>

<!-- LOGIN -->
<div id="loginSection" class="login-box">
<h2>請先登入</h2>
<button class="login-btn" onclick="loginWithGoogle()">Google 登入</button>
</div>

<!-- SELECT -->
<div id="selectSection" style="display:none;text-align:center;padding:30px;">
<h3>選擇師傅</h3>
<select id="masterSelect"></select>
<br><br>
<button onclick="saveSelection()" class="btn in">進入系統</button>
</div>

<!-- MAIN -->
<div id="mainApp" style="display:none;">

<div style="text-align:right;">
<strong id="currentMaster"></strong>
<button onclick="logout()" style="color:red;">登出</button>
</div>

<div class="tabs">
<button class="active" data-page="checkin">報到</button>
<button data-page="working">上班中</button>
</div>

<!-- CHECKIN -->
<div id="checkin" class="page active">
<select id="siteSelect"></select>
<br><br>
<input id="note" placeholder="備註">
<br><br>
<button class="btn in" id="btnIn">上班報到</button>
<button class="btn out" id="btnOut">下班報到</button>

<pre class="status" id="checkinStatus">等待操作...</pre>
</div>

<!-- WORKING -->
<div id="working" class="page">
<p>上班中功能（之後再接DB）</p>
</div>

</div>
</div>

<script>
// ================= FIREBASE =================
const firebaseConfig = {
apiKey:"AIzaSyA1_1XFRJ2QyWwQ911aoLlzOLJ_DEcVlbY",
authDomain:"dad-host-arrive.firebaseapp.com",
projectId:"dad-host-arrive"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ================= DATA =================
const masters = ["楊家齊","陳俊孝","葉芷柔","林慧筑"];
const sites = ["達麗","拾穗","寶輝"];

// ================= SAFE INIT =================
function initSelects() {
const m = document.getElementById("masterSelect");
const s = document.getElementById("siteSelect");

if (!m || !s) return;

m.innerHTML = "";
s.innerHTML = "";

masters.forEach(x=>{
let o=document.createElement("option");
o.value=x;o.textContent=x;
m.appendChild(o);
});

sites.forEach(x=>{
let o=document.createElement("option");
o.value=x;o.textContent=x;
s.appendChild(o);
});
}

// ================= LOGIN =================
function loginWithGoogle(){
const provider = new firebase.auth.GoogleAuthProvider();
auth.signInWithPopup(provider);
}

// ================= SAVE =================
function saveSelection(){
const m=document.getElementById("masterSelect").value;
if(!m) return alert("選擇師傅");

localStorage.setItem("m",m);
showMain(m);
}

// ================= UI =================
function showMain(m){
document.getElementById("selectSection").style.display="none";
document.getElementById("mainApp").style.display="block";
document.getElementById("currentMaster").textContent=m;
initSelects();
}

// ================= LOGOUT =================
function logout(){
auth.signOut();
localStorage.clear();
location.reload();
}

// ================= AUTH =================
auth.onAuthStateChanged(user=>{
if(user){
document.getElementById("loginSection").style.display="none";

const m=localStorage.getItem("m");

if(m){
showMain(m);
}else{
document.getElementById("selectSection").style.display="block";
initSelects();
}
}else{
document.getElementById("loginSection").style.display="block";
document.getElementById("selectSection").style.display="none";
document.getElementById("mainApp").style.display="none";
}
});

// ================= TABS =================
document.querySelectorAll(".tabs button").forEach(b=>{
b.onclick=()=>{
document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));

b.classList.add("active");
document.getElementById(b.dataset.page).classList.add("active");
};
});
</script>
</body>
</html>
