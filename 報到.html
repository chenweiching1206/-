<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>師傅報到系統</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    body {
      margin:0;
      font-family: Arial,"Microsoft JhengHei",sans-serif;
      background:#f3f4f6;
      padding:20px;
    }

    .app {
      max-width: 900px;
      margin: 0 auto;
      background:#fff;
      border-radius:16px;
      box-shadow:0 10px 24px rgba(0,0,0,.08);
      padding:20px;
    }

    h1 {
      margin:0 0 10px;
      text-align:center;
      color:#1e40af;
    }

    .login-box {
      text-align:center;
      padding:50px 20px;
    }

    .login-btn {
      background:#db4437;
      color:white;
      padding:16px 32px;
      font-size:20px;
      border:none;
      border-radius:8px;
      cursor:pointer;
    }

    .tabs {
      display:flex;
      gap:10px;
      margin-bottom:16px;
      flex-wrap: wrap;
    }

    .tabs button {
      border:none;
      padding:10px 12px;
      border-radius:8px;
      background:#e5e7eb;
      cursor:pointer;
      font-weight:700;
    }

    .tabs button.active {
      background:#2563eb;
      color:#fff;
    }

    .page {
      display:none;
    }

    .page.active {
      display:block;
    }

    .grid {
      display:grid;
      gap:12px;
    }

    @media (min-width: 700px) {
      .grid.two {
        grid-template-columns: 1fr 1fr;
      }
    }

    label {
      font-weight:700;
      display:block;
      margin-bottom:6px;
    }

    input, select, textarea {
      width:100%;
      border:1px solid #d1d5db;
      border-radius:8px;
      padding:10px;
      font-size:15px;
    }

    .btns {
      display:flex;
      gap:14px;
      flex-wrap: wrap;
      margin-top:10px;
    }

    .btn {
      border:none;
      border-radius:8px;
      color:#fff;
      padding:10px 14px;
      font-weight:700;
      cursor:pointer;
    }

    .btn.in {
      background:#2563eb;
      font-size:30px;
      padding:24px 34px;
      min-width:240px;
    }

    .btn.out {
      background:#0f766e;
      font-size:30px;
      padding:24px 34px;
      min-width:240px;
    }

    .status {
      margin-top:10px;
      background:#f9fafb;
      border:1px solid #e5e7eb;
      border-radius:8px;
      padding:10px;
      white-space: pre-wrap;
    }

    table {
      width:100%;
      border-collapse: collapse;
      margin-top:10px;
    }

    th, td {
      border:1px solid #e5e7eb;
      padding:8px;
      text-align:left;
    }

    th {
      background:#f3f4f6;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>師傅報到系統</h1>

  <!-- 登入 -->
  <div id="loginSection" class="login-box">
    <h2>請先登入系統</h2>

    <button class="login-btn" id="googleLoginBtn">
      🔑 使用 Google 帳號登入
    </button>
  </div>

  <!-- 第一次設定 -->
  <div id="selectSection" style="display:none; text-align:center; padding:40px;">

    <h2>歡迎！請完成設定</h2>

    <p>請選擇您的姓名</p>

    <select id="masterSelect">
      <option value="">-- 選擇師傅姓名 --</option>
    </select>

    <br><br>

    <button
      id="saveSelectionBtn"
      style="background:#2563eb; color:white; padding:12px 40px; font-size:18px; border:none; border-radius:8px;"
    >
      確認進入系統
    </button>

  </div>

  <!-- 主系統 -->
  <div id="mainApp" style="display:none;">

    <div style="text-align:right; margin-bottom:10px;">
      <strong id="currentMaster"></strong>
      <button id="logoutBtn" style="color:red; margin-left:15px;">登出</button>
    </div>

    <div class="tabs">
      <button class="active" data-page="checkin">報到</button>
      <button data-page="working">上班中</button>
      <button data-page="expense">雜支/餐費計算</button>
    </div>

    <!-- 報到 -->
    <section id="checkin" class="page active">

      <div class="grid two">

       

        <div>
          <label>案場名稱</label>
          <select id="siteSelect"></select>
        </div>

      </div>

      <div class="grid" style="margin-top:10px;">
        <div>
          <label>備註</label>
          <input id="note" placeholder="可不填" />
        </div>
      </div>

      <div class="btns">
        <button class="btn in" id="btnIn">上班報到</button>
        <button class="btn out" id="btnOut">下班報到</button>
      </div>

      <pre class="status" id="checkinStatus">等待操作...</pre>

    </section>

    <!-- 上班中 -->
    <section id="working" class="page">

      <button class="btn" style="background:#374151;" id="btnRefreshWorking">
        重新整理
      </button>

      <table>
        <thead>
          <tr>
            <th>師傅</th>
            <th>案場</th>
            <th>上班時間</th>
            <th>下班時間</th>
            <th>備註</th>
          </tr>
        </thead>

        <tbody id="workingBody"></tbody>
      </table>

    </section>

    <!-- 雜支 -->
    <section id="expense" class="page">

      <div class="grid two">

        <div>
          <label>日期</label>
          <input id="expenseDate" type="date" />
        </div>

      </div>

      <div class="grid" style="margin-top:10px;">

        <div>
          <label>案場名稱</label>
          <select id="expenseEmployee" disabled></select>
        </div>

      </div>

      <div class="grid two" style="margin-top:10px;">

        <div>
          <label>雜支</label>
          <input id="misc" type="number" value="0" />
        </div>

        <div>
          <label>餐費</label>
          <input id="meal" type="number" value="0" />
        </div>

      </div>

      <div class="grid two" style="margin-top:10px;">

        <div>
          <label>涼水</label>
          <input id="water" type="number" value="0" />
        </div>

        <div>
          <label>備註</label>
          <input id="expenseNote" />
        </div>

      </div>

      <div class="btns">
        <button class="btn in" id="btnExpense">
          送出單日計算
        </button>
      </div>

      <pre class="status" id="expenseStatus">等待操作...</pre>

    </section>

  </div>
</div>

<script>

document.addEventListener("DOMContentLoaded", () => {

// ================= Firebase =================

const firebaseConfig = {
  apiKey: "AIzaSyA1_1XFRJ2QyWwQ911aoLlzOLJ_DEcVlbY",
  authDomain: "dad-host-arrive.firebaseapp.com",
  projectId: "dad-host-arrive",
  storageBucket: "dad-host-arrive.firebasestorage.app",
  messagingSenderId: "78103512421",
  appId: "1:78103512421:web:8f834c32f14031b26bcd8c"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

auth.languageCode = 'zh-TW';

// ================= GAS =================
const GAS_URL = "https://script.google.com/macros/s/AKfycbyCfZIuCOltSx-3xBfv2qX5SVa6klDZG8kv-fc8nn45B5OOpJwgkUxWkuzmE0rXpRXY/exec";

// ================= DATA =================

const masters = ["楊家齊","陳俊孝","葉芷柔"];
const todaySites = ["達麗","拾穗","寶輝"];

// ================= init =================

function initSelects() {

  const emp = document.getElementById('employeeSelect');
  const site = document.getElementById('siteSelect');
  const master = document.getElementById('masterSelect');
  const expenseEmployee = document.getElementById('expenseEmployee');

  if (!emp || !site || !master || !expenseEmployee) return;

  emp.innerHTML = "";
  site.innerHTML = "";
  master.innerHTML = '<option value="">-- 選擇師傅 --</option>';
  expenseEmployee.innerHTML = "";

  masters.forEach(m => {
    const opt = document.createElement("option");
    opt.value = m;
    opt.textContent = m;

    emp.appendChild(opt);
    master.appendChild(opt.cloneNode(true));
    expenseEmployee.appendChild(opt.cloneNode(true));
  });

  todaySites.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.textContent = s;
    site.appendChild(opt);
  });
}

// ================= login =================

function loginWithGoogle() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider);
}

// ================= save =================

function saveSelection() {
  const master = document.getElementById("masterSelect").value;
  if (!master) return alert("選師傅");
  localStorage.setItem("currentMaster", master);
  showMain(master);
}

// ================= show main =================

function showMain(master) {

  document.getElementById("selectSection").style.display = "none";
  document.getElementById("mainApp").style.display = "block";

  document.getElementById("currentMaster").textContent = master;

  initSelects();

  setTimeout(() => {
    document.getElementById("employeeSelect").value = master;
    document.getElementById("expenseEmployee").value = master;
  }, 0);
}

// ================= auth =================

auth.onAuthStateChanged(user => {

  if (!user) {
    document.getElementById("loginSection").style.display = "block";
    return;
  }

  document.getElementById("loginSection").style.display = "none";

  initSelects();

  const saved = localStorage.getItem("currentMaster");

  if (saved) showMain(saved);
  else document.getElementById("selectSection").style.display = "block";
});

// ================= events =================

document.getElementById("googleLoginBtn").addEventListener("click", loginWithGoogle);
document.getElementById("saveSelectionBtn").addEventListener("click", saveSelection);
document.getElementById("logoutBtn").addEventListener("click", () => auth.signOut());
document.getElementById("btnRefreshWorking").addEventListener("click", loadWorking);

}); // ← DOMContentLoaded end

</script>
</body>
</html>>
