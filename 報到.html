<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>師傅報到系統</title>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <style>
    body { margin:0; font-family: Arial,"Microsoft JhengHei",sans-serif; background:#f3f4f6; padding:20px; }
    .app { max-width: 900px; margin: 0 auto; background:#fff; border-radius:16px; box-shadow:0 10px 24px rgba(0,0,0,.08); padding:20px; }
    h1 { margin:0 0 10px; text-align:center; color:#1e40af; }
    .login-box { text-align:center; padding:40px 20px; }
    .login-btn { background:#db4437; color:white; padding:15px 30px; font-size:18px; border:none; border-radius:8px; cursor:pointer; }
    select, button { padding:12px; font-size:17px; margin:8px 0; border-radius:8px; width:85%; max-width:500px; }
  </style>
</head>
<body>
  <div class="app">
    <h1>師傅報到系統</h1>

    <!-- 登入畫面 -->
    <div id="loginSection" class="login-box">
      <h2>請先登入系統</h2>
      <button class="login-btn" onclick="loginWithGoogle()">🔑 使用 Google 帳號登入</button>
    </div>

    <!-- 選擇師傅與案場 -->
    <div id="selectSection" style="display:none; text-align:center; padding:30px;">
      <h2>第一次設定</h2>
      <p>請選擇您的姓名與今天工作的案場</p>
      
      <select id="masterSelect"><option value="">-- 選擇師傅姓名 --</option></select><br>
      <select id="siteSelect"><option value="">-- 選擇今天案場 --</option></select><br><br>
      
      <button onclick="saveSelection()" style="background:#2563eb; color:white; padding:12px 30px; font-size:18px;">確認進入系統</button>
    </div>

    <!-- 主系統 -->
    <div id="mainApp" style="display:none;">
      <div style="text-align:right; margin-bottom:10px;">
        <strong id="currentMaster"></strong>　<span id="currentSite" style="color:#666;"></span>
        <button onclick="logout()" style="color:red; margin-left:10px;">登出</button>
      </div>

      <!-- 你的原本功能（報到、上班中、雜支） -->
      <div class="tabs">
        <button class="active" data-page="checkin">1. 報到</button>
        <button data-page="working">2. 上班中</button>
        <button data-page="expense">3. 雜支/餐費計算</button>
      </div>

      <section id="checkin" class="page active">
        <!-- 你原本的報到內容 -->
        <div class="grid two">
          <div><label>師傅姓名</label><select id="employeeSelect"></select></div>
          <div><label>案場名稱</label><select id="siteSelectMain"></select></div>
        </div>
        <div class="btns" style="margin-top:20px;">
          <button class="btn in" id="btnIn">上班報到</button>
          <button class="btn out" id="btnOut">下班報到</button>
        </div>
        <pre class="status" id="checkinStatus">等待操作...</pre>
      </section>
    </div>
  </div>

<script>
// Firebase Config
const firebaseConfig = { /* 你的 config */ };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
auth.languageCode = 'zh-TW';

const masters = [ /* 你的28位師傅名單 */ ];
const sites = ["達麗", "達麗標準", "拾穗", "寶輝"];

// 登入
function loginWithGoogle() { /* ... */ }

// 保存選擇
function saveSelection() {
  const master = document.getElementById('masterSelect').value;
  const site = document.getElementById('siteSelect').value;
  if (!master || !site) return alert('請選擇師傅姓名和案場');
  
  localStorage.setItem('currentMaster', master);
  localStorage.setItem('currentSite', site);
  showMainApp(master, site);
}

function showMainApp(master, site) {
  document.getElementById('selectSection').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  document.getElementById('currentMaster').textContent = master;
  document.getElementById('currentSite').textContent = `（${site}）`;
}

function logout() { /* ... */ }

// 監聽登入狀態
auth.onAuthStateChanged(user => {
  if (user) {
    document.getElementById('loginSection').style.display = 'none';
    const savedMaster = localStorage.getItem('currentMaster');
    const savedSite = localStorage.getItem('currentSite');
    
    if (savedMaster && savedSite) {
      showMainApp(savedMaster, savedSite);
    } else {
      // 填入選單
      const mSelect = document.getElementById('masterSelect');
      masters.forEach(m => { const o = document.createElement('option'); o.value = m; o.textContent = m; mSelect.appendChild(o); });
      
      const sSelect = document.getElementById('siteSelect');
      sites.forEach(s => { const o = document.createElement('option'); o.value = s; o.textContent = s; sSelect.appendChild(o); });
      
      document.getElementById('selectSection').style.display = 'block';
    }
  }
});
</script>
</body>
</html>
